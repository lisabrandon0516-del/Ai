[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-rivals-ai"
version = "0.1.0"
description = "Standalone Retail Rivals AI. The corporate sim is not in this repository."
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["open_late*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
